<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="955" viewBox="0 0 1280 955" role="img" aria-labelledby="cap-title cap-desc"><title id="cap-title">Richard Butts: Twelve engineering projects with private equity integration and revenue integrity capabilities</title><desc id="cap-desc">Enterprise integration connects business units and operating brands through a governed control layer to consolidated executive intelligence. Private equity portfolio integration is one proven application. Twelve engineering projects are shown across revenue and analytics, GTM and control, enterprise architecture, and temporal and AI assurance. Eleven prior projects are joined by the Enterprise Revenue Integrity Platform, whose local CRM-to-billing-to-ERP foundation and partial financial reconciliation were verified at its current draft pull request. Native execution in established projects includes Salesforce Developer Edition, Snowflake fixture tests, BigQuery public GA4 sample queries, and local Qwen3 inference.</desc><g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="815" rx="24" fill="#10101D"/><rect x="1" y="1" width="1278" height="953" rx="23" fill="none" stroke="#7C7CAF" stroke-width="2"/><path d="M0 141 H1280" stroke="#2E2E45" stroke-width="1"/><rect x="34" y="31" width="5" height="75" rx="2.5" fill="#B8B8FF"/><text x="54" y="60" font-size="15" letter-spacing="3" fill="#C5C5DB" font-weight="700">ENGINEERING PORTFOLIO · CAPABILITY MAP</text><text x="54" y="101" font-size="28" font-family="JetBrains Mono, IBM Plex Mono, monospace" font-weight="700" fill="#F0F0FF">Enterprise Architecture · Revenue Integrity · Applied AI</text><text x="1242" y="60" text-anchor="end" font-size="15" fill="#C5C5DB" font-weight="700">12 ENGINEERING PROJECTS</text><g id="portfolio-impact-and-new-platform">
