<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="815" viewBox="0 0 1280 815" role="img" aria-labelledby="cap-title cap-desc"><title id="cap-title">Richard Butts: Nine public engineering projects in four capability groups</title><desc id="cap-desc">Revenue and analytics, GTM and control, enterprise architecture, and temporal and AI assurance. Each group lists executable GitHub projects and their main capabilities.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1280" height="815" rx="24" fill="#0B1326"/><rect x="1" y="1" width="1278" height="813" rx="23" fill="none" stroke="#33435C" stroke-width="2"/><path d="M0 141 H1280" stroke="#253951" stroke-width="1"/><rect x="34" y="31" width="5" height="75" rx="2.5" fill="#92AAFF"/><text x="54" y="60" font-size="15" letter-spacing="3" fill="#A8BEDB" font-weight="700">ENGINEERING PORTFOLIO · CAPABILITY MAP</text><text x="54" y="101" font-size="31" font-weight="700" fill="#F8FAFC">Signal vs. Noise. Systems that prove what is true.</text><text x="1242" y="60" text-anchor="end" font-size="15" fill="#8CA2C4" font-weight="700">9 EXECUTABLE SYSTEMS</text><rect x="24" y="158" width="1232" height="141" rx="16" fill="#16233D" stroke="#35445A" stroke-width="1.2"/><rect x="24" y="158" width="5" height="141" rx="2" fill="#92AAFF"/><text x="49" y="193" font-size="13" letter-spacing="1.25" fill="#92AAFF" font-weight="700">01  REVENUE &amp; ANALYTICS</text><text x="49" y="227" font-size="18" fill="#F2F6FC" font-weight="600">Which commercial numbers</text><text x="49" y="252" font-size="18" fill="#F2F6FC" font-weight="600">can we trust?</text><rect x="304" y="180" width="1.5" height="96" fill="#4A5B75"/><rect x="327.0" y="183" width="447.0" height="92" rx="12" fill="#20345B" stroke="#92AAFF" stroke-opacity="0.76" stroke-width="1.3"/><rect x="342.0" y="200" width="22" height="4" rx="2" fill="#92AAFF"/><text x="342.0" y="230" font-size="20" font-weight="700" fill="#FFFFFF">Revenue Metrics Platform</text><text x="342.0" y="255" font-size="14.5" fill="#D1D9E8">Governed measures · SCD2 · Reconciliation</text><rect x="786.0" y="183" width="447.0" height="92" rx="12" fill="#20345B" stroke="#92AAFF" stroke-opacity="0.76" stroke-width="1.3"/><rect x="801.0" y="200" width="22" height="4" rx="2" fill="#92AAFF"/><text x="801.0" y="230" font-size="20" font-weight="700" fill="#FFFFFF">MarTech Data Reliability</text><text x="801.0" y="255" font-size="14.5" fill="#D1D9E8">Data contracts · Corrections · Recovery</text><rect x="24" y="312" width="1232" height="141" rx="16" fill="#142D35" stroke="#35445A" stroke-width="1.2"/><rect x="24" y="312" width="5" height="141" rx="2" fill="#66DAD0"/><text x="49" y="347" font-size="13" letter-spacing="1.25" fill="#66DAD0" font-weight="700">02  GTM &amp; CONTROL</text><text x="49" y="381" font-size="18" fill="#F2F6FC" font-weight="600">Which signals deserve action,</text><text x="49" y="406" font-size="18" fill="#F2F6FC" font-weight="600">and what may AI change?</text><rect x="304" y="334" width="1.5" height="96" fill="#4A5B75"/><rect x="327.0" y="337" width="447.0" height="92" rx="12" fill="#16484B" stroke="#66DAD0" stroke-opacity="0.76" stroke-width="1.3"/><rect x="342.0" y="354" width="22" height="4" rx="2" fill="#66DAD0"/><text x="342.0" y="384" font-size="20" font-weight="700" fill="#FFFFFF">Customer Signal &amp; Activation</text><text x="342.0" y="409" font-size="14.5" fill="#D1D9E8">Live AI seller workbench · Signal-to-cash</text><rect x="786.0" y="337" width="447.0" height="92" rx="12" fill="#16484B" stroke="#66DAD0" stroke-opacity="0.76" stroke-width="1.3"/><rect x="801.0" y="354" width="22" height="4" rx="2" fill="#66DAD0"/><text x="801.0" y="384" font-size="19" font-weight="700" fill="#FFFFFF">Enterprise MarTech / AI Control Plane</text><text x="801.0" y="409" font-size="14.5" fill="#D1D9E8">Canonical identity · No-Regress · Recovery</text><rect x="24" y="466" width="1232" height="141" rx="16" fill="#29233E" stroke="#35445A" stroke-width="1.2"/><rect x="24" y="466" width="5" height="141" rx="2" fill="#C2A8FF"/><text x="49" y="501" font-size="13" letter-spacing="1.25" fill="#C2A8FF" font-weight="700">03  ENTERPRISE ARCHITECTURE</text><text x="49" y="535" font-size="18" fill="#F2F6FC" font-weight="600">Can platforms change</text><text x="49" y="560" font-size="18" fill="#F2F6FC" font-weight="600">without breaking trust?</text><rect x="304" y="488" width="1.5" height="96" fill="#4A5B75"/><rect x="327.0" y="491" width="294.0" height="92" rx="12" fill="#3A315A" stroke="#C2A8FF" stroke-opacity="0.76" stroke-width="1.3"/><rect x="342.0" y="508" width="22" height="4" rx="2" fill="#C2A8FF"/><text x="342.0" y="538" font-size="16.5" font-weight="700" fill="#FFFFFF">MarTech Estate Impact</text><text x="342.0" y="563" font-size="13" fill="#D1D9E8">Dependencies · Evidence</text><rect x="633.0" y="491" width="294.0" height="92" rx="12" fill="#3A315A" stroke="#C2A8FF" stroke-opacity="0.76" stroke-width="1.3"/><rect x="648.0" y="508" width="22" height="4" rx="2" fill="#C2A8FF"/><text x="648.0" y="538" font-size="16.5" font-weight="700" fill="#FFFFFF">MarTech Migration Assurance</text><text x="648.0" y="563" font-size="13" fill="#D1D9E8">Verified cutover · Rollback</text><rect x="939.0" y="491" width="294.0" height="92" rx="12" fill="#3A315A" stroke="#C2A8FF" stroke-opacity="0.76" stroke-width="1.3"/><rect x="954.0" y="508" width="22" height="4" rx="2" fill="#C2A8FF"/><text x="954.0" y="538" font-size="16.5" font-weight="700" fill="#FFFFFF">MarTech Stack Economics</text><text x="954.0" y="563" font-size="13" fill="#D1D9E8">Constraints · Cost · Capacity</text><rect x="24" y="620" width="1232" height="141" rx="16" fill="#302922" stroke="#35445A" stroke-width="1.2"/><rect x="24" y="620" width="5" height="141" rx="2" fill="#F2BE81"/><text x="49" y="655" font-size="13" letter-spacing="1.25" fill="#F2BE81" font-weight="700">04  TIME &amp; AI ASSURANCE</text><text x="49" y="689" font-size="18" fill="#F2F6FC" font-weight="600">What if evidence changes</text><text x="49" y="714" font-size="18" fill="#F2F6FC" font-weight="600">after a decision?</text><rect x="304" y="642" width="1.5" height="96" fill="#4A5B75"/><rect x="327.0" y="645" width="447.0" height="92" rx="12" fill="#533A2C" stroke="#F2BE81" stroke-opacity="0.76" stroke-width="1.3"/><rect x="342.0" y="662" width="22" height="4" rx="2" fill="#F2BE81"/><text x="342.0" y="692" font-size="20" font-weight="700" fill="#FFFFFF">Temporal Customer Audiences</text><text x="342.0" y="717" font-size="14.5" fill="#D1D9E8">Original · Restated · Current</text><rect x="786.0" y="645" width="447.0" height="92" rx="12" fill="#533A2C" stroke="#F2BE81" stroke-opacity="0.76" stroke-width="1.3"/><rect x="801.0" y="662" width="22" height="4" rx="2" fill="#F2BE81"/><text x="801.0" y="692" font-size="19" font-weight="700" fill="#FFFFFF">Enterprise Agent Runtime &amp; Evaluation</text><text x="801.0" y="717" font-size="14.5" fill="#D1D9E8">Live model tests · Release gates</text><text x="35" y="795" font-size="13" fill="#9BB0CE">Public technical evidence · Synthetic commercial scenarios · Documented operating boundaries</text><text x="1245" y="795" text-anchor="end" font-size="13" fill="#9BB0CE">GROUNDBREAKERS DIGITAL</text></g></svg>
