<svg xmlns="http://www.w3.org/2000/svg" width="600" height="212" viewBox="0 0 600 212" role="img" aria-labelledby="title desc">
<title id="title">Native AWS Application Recovery, Control Plane validation</title>
<desc id="desc">Two sequential real AWS RDS point-in-time restores using synthetic application effects. First restore: three intents versus five independent receipts, execution blocked. Second restore: five intents and receipts, fresh authorization, then six intents and six effects without duplicates.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151525"/><stop offset="1" stop-color="#10101D"/></linearGradient></defs>
<rect width="600" height="212" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="598" height="210" rx="15" fill="none" stroke="#474760"/>
<rect x="21" y="22" width="4" height="42" rx="2" fill="#B8B8FF"/>
<g font-family="Arial,Segoe UI,sans-serif">
<text x="37" y="37" font-size="11" letter-spacing="2" fill="#B8B8FF" font-weight="700">SYSTEMS / CLOUD RECOVERY</text>
<text x="37" y="64" font-size="21" fill="#F1F1FF" font-weight="700">Native AWS Application Recovery</text>
<path d="M22 88 H578" stroke="#35354B"/>
<g fill="none" stroke="#B8B8FF" stroke-width="1.7" opacity=".9" stroke-linecap="round" stroke-linejoin="round">
<path d="M151 140 H157 m-6 -5 l6 5 l-6 5"/><path d="M290 140 H296 m-6 -5 l6 5 l-6 5"/><path d="M429 140 H435 m-6 -5 l6 5 l-6 5"/>
</g>
<rect x="22" y="113" width="126" height="54" rx="10" fill="#24243A" stroke="#555574" stroke-width="1.1"/>
<circle cx="37" cy="127" r="3" fill="#B8B8FF"/>
<text x="85" y="143" text-anchor="middle" font-size="15" font-weight="600" fill="#F0F0FF">PITR #1</text>
<text x="85" y="159" text-anchor="middle" font-size="11" fill="#C5C7DD">Earlier restore</text>
<rect x="161" y="113" width="126" height="54" rx="10" fill="#332A25" stroke="#DEAD71" stroke-width="1.3"/>
<circle cx="176" cy="127" r="3" fill="#DEAD71"/>
<text x="224" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD4A2">3/5 BLOCKED</text>
<text x="224" y="159" text-anchor="middle" font-size="11" fill="#F0D3B7">No unsafe replay</text>
<rect x="300" y="113" width="126" height="54" rx="10" fill="#24243A" stroke="#555574" stroke-width="1.1"/>
<circle cx="315" cy="127" r="3" fill="#B8B8FF"/>
<text x="363" y="143" text-anchor="middle" font-size="15" font-weight="600" fill="#F0F0FF">PITR #2</text>
<text x="363" y="159" text-anchor="middle" font-size="11" fill="#C5C7DD">Fresh approval</text>
<rect x="439" y="113" width="126" height="54" rx="10" fill="#1E3434" stroke="#91D6D0" stroke-width="1.5"/>
<circle cx="454" cy="127" r="3" fill="#91D6D0"/>
<text x="502" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#A7EFE3">6/6 SAFE</text>
<text x="502" y="159" text-anchor="middle" font-size="11" fill="#BCE8E1">0 duplicates</text>
<text x="23" y="193" font-size="14.2" fill="#C7C7DC">RDS recovery | independent receipts | current consent</text>
</g>
</svg>